<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Propertix v16.3">
<meta name="theme-color" content="#0d1f0d">
<meta name="description" content="Propertix — het klassieke vastgoedspel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Propertix v16.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body,#app{height:100%;overflow:hidden;font-family:Georgia,serif;background:#0d1f0d;color:#fff}
#app{display:flex;flex-direction:column}
button{font-family:Georgia,serif;touch-action:manipulation}
input{font-family:Georgia,serif}
::-webkit-scrollbar{display:none}

/* Die spin animation — applied via class, not inline style */
@keyframes diespin{0%{transform:rotate(0deg) scale(1.05)}100%{transform:rotate(360deg) scale(1.05)}}
.die-rolling{animation:diespin 0.1s linear infinite}

/* Pawn CSS transition — always on so it slides smoothly */
.pawn{
  position:absolute;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.9));
  /* Use transform instead of left/top — GPU composited, no ghosting/trails */
  transition:transform 0.2s ease;
  will-change:transform;
  transform:translate(0px,0px);
  pointer-events:none;
  z-index:10;
  left:0;top:0; /* anchor at 0,0 — position via transform only */
}
.pawn-label{
  position:absolute;top:32px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.8);font-size:8px;font-weight:bold;
  border-radius:4px;padding:1px 5px;white-space:nowrap;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateX(-50%) translateY(16px)}
  15%{opacity:1;transform:translateX(-50%) translateY(0)}
  80%{opacity:1}100%{opacity:0}
}
.toast{
  position:fixed;bottom:190px;left:50%;
  background:rgba(0,0,0,0.88);
  border-radius:12px;padding:10px 18px;
  font-size:13px;font-weight:bold;z-index:100;
  max-width:85vw;text-align:center;
  animation:toastIn 2.6s ease forwards;
  pointer-events:none;
}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Zwevend +€/-€ bedrag boven een spelerskaart bij een geldwijziging */
@keyframes moneyFloat{
  0%{opacity:0;transform:translate(-50%,4px) scale(0.9)}
  15%{opacity:1;transform:translate(-50%,0) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-16px) scale(1)}
}
.money-float{animation:moneyFloat 1.1s ease forwards}

/* Confetti bij het winnen van het spel */
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:0.95}
  100%{transform:translateY(110vh) rotate(540deg);opacity:0}
}

/* Deed card flip bij het kopen van een straat */
@keyframes deedFlip{
  0%{transform:rotateY(0deg) scale(0.75);opacity:0}
  10%{opacity:1}
  60%{transform:rotateY(180deg) scale(1.06)}
  100%{transform:rotateY(180deg) scale(1)}
}

/* Chat — alleen zichtbaar tijdens online multiplayer */
.chat-toggle-btn{
  position:fixed;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;
  background:#FFD700;color:#000;border:none;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.55);z-index:150;cursor:pointer;
}
.chat-badge{
  position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;
  background:#e03030;color:#fff;border-radius:9px;font-size:10px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #0d1f0d;
}
.chat-panel{
  position:fixed;left:0;right:0;bottom:0;max-height:66vh;
  background:#0f2a0f;border-radius:18px 18px 0 0;border-top:2px solid #4a8a4a;
  display:flex;flex-direction:column;z-index:180;
  transform:translateY(105%);transition:transform 0.25s ease;
  box-shadow:0 -6px 20px rgba(0,0,0,0.5);
}
.chat-panel.chat-panel-open{transform:translateY(0);}
.chat-tab{
  flex-shrink:0;padding:6px 12px;font-size:11px;border-radius:14px;border:1px solid #2a4a2a;
  background:rgba(255,255,255,0.04);color:#ccc;cursor:pointer;position:relative;white-space:nowrap;
}
.chat-tab.chat-tab-active{background:rgba(255,215,0,0.14);border-color:#FFD700;color:#FFD700;font-weight:bold;}
.chat-tab-dot{
  position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:#e03030;box-shadow:0 0 0 2px #0f2a0f;
}
.chat-bubble{max-width:78%;padding:6px 10px;border-radius:12px;font-size:12.5px;line-height:1.4;margin-bottom:6px;word-wrap:break-word;}
.chat-bubble-mine{background:#1a6e1a;color:#fff;margin-left:auto;border-bottom-right-radius:3px;}
.chat-bubble-theirs{background:rgba(255,255,255,0.08);color:#eee;margin-right:auto;border-bottom-left-radius:3px;}
.chat-bubble-name{font-size:10px;color:#4caf50;margin-bottom:2px;font-weight:bold;}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/multiplayer.js"></script>
<script src="js/chat.js"></script>
<script src="js/save.js"></script>
<script src="js/game-logic.js"></script>
<script src="js/ui.js"></script>
<script>
DOM.app=document.getElementById("app");
// Persistent modal overlay — always in body, works on menu AND game screen
DOM.overlayContainer=document.createElement("div");
DOM.overlayContainer.id="overlay";
document.body.appendChild(DOM.overlayContainer);
chatBuildDOM();
showMenu();
</script>
</body>
</html>
